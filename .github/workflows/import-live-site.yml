name: import-live-site
on:
  push:
    paths: ['.github/workflows/import-live-site.yml']
permissions: {contents: write}
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for B in https://company-of-merchants.vercel.app https://company-of-merchants-rhcmhk.vercel.app https://company-of-merchants-hqlb1btnk-rhcmhk.vercel.app; do
            if curl -fsS "$B/site.js" -o /tmp/s.js && grep -q PRODUCTS /tmp/s.js; then BASE=$B; break; fi
          done
          [ -n "$BASE" ] || { echo "no reachable base"; exit 1; }
          echo "BASE=$BASE"; mkdir -p assets
          for f in site.js styles.css assets/favicon.png assets/insignia.webp; do curl -fsS "$BASE/$f" -o "$f"; done
          git rm -q .github/workflows/import-live-site.yml
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -qm "Import site.js, styles.css and assets from the live Vercel site" && git push
