name: import-live-site
on:
  push:
    paths: ['.github/workflows/import-live-site.yml']
permissions: {contents: write}
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          B=https://company-of-merchants.vercel.app
          mkdir -p assets
          for f in site.js styles.css assets/favicon.png assets/insignia.webp; do curl -fsS "$B/$f" -o "$f"; done
          sha1sum site.js styles.css assets/*
          git rm -q .github/workflows/import-live-site.yml
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -qm "Import site.js, styles.css and assets from the live Vercel site" && git push
